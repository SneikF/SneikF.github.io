# =====================================================================
#  Frases fijas del sitio en español (Guía §12, «Frases fijas»)
#  Las plantillas las piden con  i18n "nombre"  y Hugo pone aquí la del idioma.
#  Cambia solo el texto entre comillas; el nombre entre [ ] debe quedar igual
#  en es.toml y en.toml. Para un idioma nuevo, copia este archivo (p. ej. fr.toml).
# =====================================================================

# Tiempo de lectura (ya no se muestra; se conserva por si lo quieres volver a usar)
[lectura]
other = "{{ .Count }} min de lectura"

# Enlace al final de una lista resumida (sin uso actual)
