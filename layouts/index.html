{{ define "main" }}
<section class="portada">
  <h1 class="solo-lectores">{{ site.Title }}</h1>
  {{ with .Params.subtitulo }}<p class="portada-subtitulo">{{ . }}</p>{{ end }}
</section>

{{/* Foto (en static/img/) y texto de presentación (el cuerpo de content/_index.md) */}}
<section class="presentacion">
  {{ with .Params.foto }}<img class="foto-perfil" src="{{ . | relURL }}" alt="{{ site.Title }}" tabindex="0">{{ end }}
  <div class="intro">
    {{ .Content }}
  </div>
</section>
{{ end }}
