<!doctype html>
<html lang="{{ site.Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ .Section | default "inicio" }}">
  {{ partial "header.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script>
    document.getElementById('tema').addEventListener('click', function () {
      var r = document.documentElement;
      var actual = r.dataset.tema || (matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro');
      var nuevo = actual === 'oscuro' ? 'claro' : 'oscuro';
      r.dataset.tema = nuevo;
      try { localStorage.setItem('tema', nuevo); } catch (e) {}
    });
  </script>
</body>
</html>
