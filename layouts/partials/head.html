<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  /* Aplica el tema guardado antes de pintar, para que no parpadee */
  try { var t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.tema = t; } catch (e) {}
</script>
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.descripcion }}{{ end }}">
<meta name="author" content="{{ site.Params.autor }}">
{{/* Fuentes libres (licencia OFL) servidas por Bunny Fonts, sin rastreo */}}
<link rel="preconnect" href="https://fonts.bunny.net">
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=kalam:300,700|caveat:500,700&display=swap">
<link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
<script defer src="{{ "js/sitio.js" | relURL }}"></script>
{{ with .OutputFormats.Get "rss" }}
<link rel="alternate" type="application/rss+xml" href="{{ .RelPermalink }}" title="{{ site.Title }}">
{{ end }}
{{ range .Translations }}
<link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">
{{ end }}
{{ if or .Params.math (eq .Section "posts") }}
  {{ partial "math.html" . }}
{{ end }}
